apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-dashboard-temperature-sync
  namespace: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-dashboard-temperature-sync
  namespace: homelab
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - cluster-dashboard-config
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-dashboard-temperature-sync
  namespace: homelab
subjects:
  - kind: ServiceAccount
    name: cluster-dashboard-temperature-sync
    namespace: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-dashboard-temperature-sync